# Control Plane 컨테이너용 최소 HTTP 설정.
# Jetty 확장 기본값 참고: web.http.port, web.http.path
# https://github.com/eclipse-edc/Connector/blob/main/extensions/common/http/jetty-core/README.md

web.http.port=19191
web.http.path=/api

edc.hostname=edc-cp

# Control API — Jetty 는 동일 물리 포트에 default/control 컨텍스트를 중복 등록할 수 없습니다.
# 기본값: ControlApiConfigurationExtension (port=9191, path=/api/control)
web.http.control.port=9191
web.http.control.path=/api/control
