# Control Plane 컨테이너용 최소 HTTP 설정.
# Jetty 확장 기본값 참고: web.http.port, web.http.path
# https://github.com/eclipse-edc/Connector/blob/main/extensions/common/http/jetty-core/README.md

web.http.port=19191
web.http.path=/api

edc.hostname=edc-cp

# 로컬 데모용: PolicyDefinitionApiEndToEndTest InMemory 과 동일 (엄격 ODRL 검증 비활성화).
edc.policy.validation.enabled=false

# Control API — Jetty 는 동일 물리 포트에 default/control 컨텍스트를 중복 등록할 수 없습니다.
# 기본값: ControlApiConfigurationExtension (port=9191, path=/api/control)
web.http.control.port=9191
web.http.control.path=/api/control

# Management / DSP Protocol — Eclipse EDC 기본값 (별도 Jetty 컨텍스트).
# management-api-configuration README: https://github.com/eclipse-edc/Connector/tree/main/extensions/common/api/management-api-configuration
web.http.management.port=8181
web.http.management.path=/api/management
web.http.protocol.port=8282
web.http.protocol.path=/api/protocol
