# Provider Control Plane (consumer 와 동일 HTTP 레이아웃, 호스트명만 분리).
# edc.hostname 은 Compose 서비스 DNS 이름(provider-cp)과 같게 두면 EDC 0.14.x 에서
# /api/check/liveness 만 404 가 되어 Docker 헬스체크가 실패할 수 있음 — 고유 값 사용.

web.http.port=19191
web.http.path=/api

edc.hostname=mxd-provider

edc.policy.validation.enabled=false

web.http.control.port=9191
web.http.control.path=/api/control

web.http.management.port=8181
web.http.management.path=/api/management
web.http.protocol.port=8282
web.http.protocol.path=/api/protocol
