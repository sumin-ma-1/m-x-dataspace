# Data Plane 컨테이너용 최소 HTTP 설정 (CP 와 포트 충돌 방지).

web.http.port=19192
web.http.path=/api

# Self-registration 시 DataPlaneInstance 에 실릴 공개 URL (Docker Compose 서비스명)
edc.hostname=edc-dp
# DP 도 default/control 포트를 분리해야 합니다 (Jetty PortMappingRegistry 제약).
web.http.control.port=9192
web.http.control.path=/api/control

# Data Plane IAM 기본 확장이 요구하는 키 별칭 (샘플용 더미 값).
# 운영에서는 실제 Vault + 키 페어로 교체해야 합니다.
# 참고: DataPlaneIamDefaultServicesExtension (Connector data-plane-iam 모듈)
edc.transfer.proxy.token.signer.privatekey.alias=dev-dp-signer
edc.transfer.proxy.token.verifier.publickey.alias=dev-dp-verifier
