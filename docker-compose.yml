# 로컬 검증용 Compose.
# 문서: https://docs.docker.com/compose/
#
# 포트 요약 (호스트):
#   Consumer (edc-cp / edc-dp):
#     19191 — CP 공개 API (web.http)
#     19199 — CP Control API (web.http.control → 컨테이너 9191)
#     18181 — CP Management API (web.http.management → 8181)  … Catalog/자산/정책
#     18282 — CP DSP Protocol (web.http.protocol → 8282)      … counterPartyAddress 베이스
#     19192 — DP 공개 API
#     19299 — DP Control API (컨테이너 9192)
#   Provider (provider-cp / provider-dp):
#     29191, 29199, 28181, 28282, 29192, 29299 (동일 역할)
#
# 사용:
#   docker compose up --build
# 검증 스크립트:
#   powershell -ExecutionPolicy Bypass -File scripts/verify.ps1
# 카탈로그 + 계약 협상 + 데이터 전송 데모 (호스트에서, 스택 기동 후):
#   python scripts/catalog_demo.py

services:
  edc-ui:
    build:
      context: .
      dockerfile: Dockerfile.edc-ui
    depends_on:
      edc-cp:
        condition: service_healthy
      provider-cp:
        condition: service_healthy
    ports:
      - "18080:8080"
    profiles:
      - ui

  app:
    build:
      context: .
      dockerfile: catena-x-sw-sample/Dockerfile
    environment:
      APP_CONSUMER_MGMT_URL: http://edc-cp:8181/api/management
      APP_CONSUMER_DEFAULT_URL: http://edc-cp:19191/api
      APP_CONSUMER_PROTOCOL_URL: http://edc-cp:8282/api/protocol
      APP_PROVIDER_MGMT_URL: http://provider-cp:8181/api/management
      APP_PROVIDER_DEFAULT_URL: http://provider-cp:19191/api
      APP_PROVIDER_DSP_URL: http://provider-cp:8282/api/protocol/2025-1
      APP_PROVIDER_PROTOCOL_URL: http://provider-cp:8282/api/protocol
      APP_COUNTER_PARTY_ID: counter-party-id
      APP_PROVIDER_PARTICIPANT_ID: anonymous
    depends_on:
      edc-cp:
        condition: service_healthy
      provider-cp:
        condition: service_healthy
    ports:
      - "18000:8000"
    profiles:
      - app

  edc-cp:
    build:
      context: .
      dockerfile: edc-core-fork/runtime/Dockerfile.control-plane
    ports:
      - "19191:19191"
      - "19199:9191"
      - "18181:8181"
      - "18282:8282"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:19191/api/check/liveness"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 90s

  edc-dp:
    build:
      context: .
      dockerfile: edc-core-fork/runtime/Dockerfile.data-plane
    depends_on:
      edc-cp:
        condition: service_healthy
    environment:
      EDC_DPF_SELECTOR_URL: http://edc-cp:9191/api/control/v1/dataplanes
    ports:
      - "19192:19192"
      - "19299:9192"

  provider-cp:
    build:
      context: .
      dockerfile: edc-core-fork/runtime/Dockerfile.control-plane
    volumes:
      - ./edc-core-fork/runtime/minimal-control-plane/docker/dataspaceconnector-configuration.provider.properties:/app/dataspaceconnector-configuration.properties:ro
    ports:
      - "29191:19191"
      - "29199:9191"
      - "28181:8181"
      - "28282:8282"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:19191/api/check/liveness"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 90s

  provider-dp:
    build:
      context: .
      dockerfile: edc-core-fork/runtime/Dockerfile.data-plane
    depends_on:
      provider-cp:
        condition: service_healthy
    environment:
      EDC_DPF_SELECTOR_URL: http://provider-cp:9191/api/control/v1/dataplanes
    volumes:
      - ./edc-core-fork/runtime/minimal-data-plane/docker/dataspaceconnector-configuration.provider.properties:/app/dataspaceconnector-configuration.properties:ro
    ports:
      - "29192:19192"
      - "29299:9192"
